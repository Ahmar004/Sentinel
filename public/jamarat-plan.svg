<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="1200" height="800" role="img" aria-label="Site plan, Mina Jamarat Bridge, central deck section, 300 metres by 200 metres">
  <title>Mina - Jamarat Bridge, central deck section</title>
  <desc>Top-down plan of a 300 by 200 metre section of the Jamarat Bridge deck in Mina, drawn at one unit per ground metre so it aligns with the 60 by 40 cell grid. Image top is north. Shows the Jamrat al-Aqaba and Jamrat al-Wusta basins, the west deck approach, the two exits and the surrounding camp roads.</desc>

  <defs>
    <pattern id="camp" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#87847d"/>
      <rect width="9" height="9" x="0.5" y="0.5" fill="none" stroke="#95928a" stroke-width="0.4"/>
    </pattern>
    <pattern id="deck" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#c9c5bc"/>
      <path d="M0 0 L0 20 M0 0 L20 0" stroke="#bfbab0" stroke-width="0.35"/>
    </pattern>
    <radialGradient id="basin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5a198"/>
      <stop offset="72%" stop-color="#b5b1a8"/>
      <stop offset="100%" stop-color="#c2beb5"/>
    </radialGradient>
  </defs>

  <!-- Mina camp ground and service roads outside the structure -->
  <rect x="0" y="0" width="300" height="200" fill="url(#camp)"/>

  <!-- ================= Bridge deck ================= -->
  <rect x="10" y="10" width="280" height="180" rx="12" fill="url(#deck)" stroke="#8a867e" stroke-width="1.4"/>
  <rect x="10" y="10" width="280" height="3.5" fill="#a5a199"/>
  <rect x="10" y="186.5" width="280" height="3.5" fill="#a5a199"/>

  <!-- Structural column lines under the deck -->
  <g fill="#b3afa6">
    <rect x="50" y="18" width="2.4" height="5"/><rect x="50" y="177" width="2.4" height="5"/>
    <rect x="100" y="18" width="2.4" height="5"/><rect x="100" y="177" width="2.4" height="5"/>
    <rect x="150" y="18" width="2.4" height="5"/><rect x="150" y="177" width="2.4" height="5"/>
    <rect x="200" y="18" width="2.4" height="5"/><rect x="200" y="177" width="2.4" height="5"/>
    <rect x="250" y="18" width="2.4" height="5"/><rect x="250" y="177" width="2.4" height="5"/>
  </g>

  <!-- ================= Jamrat al-Aqaba ================= -->
  <!-- Centred on ground (157 m east, 112 m north), which is cell C-031-022,
       the cell the canonical alert fires on. -->
  <g>
    <ellipse cx="157" cy="88" rx="34" ry="24" fill="url(#basin)" stroke="#7a766f" stroke-width="1.8"/>
    <ellipse cx="157" cy="88" rx="25" ry="16.5" fill="#b7b3aa" stroke="#8a867e" stroke-width="1"/>
    <rect x="151.5" y="74" width="11" height="28" rx="4.5" fill="#6b6862" stroke="#565350" stroke-width="0.8"/>
    <text x="157" y="58" font-family="system-ui, sans-serif" font-size="6.5" fill="#403e3b" text-anchor="middle">Jamrat al-Aqaba</text>
  </g>

  <!-- ================= Jamrat al-Wusta ================= -->
  <!-- Centred on ground (75 m east, 50 m north), inside the southern
       west-side region. -->
  <g>
    <ellipse cx="75" cy="150" rx="30" ry="21" fill="url(#basin)" stroke="#7a766f" stroke-width="1.8"/>
    <ellipse cx="75" cy="150" rx="22" ry="14.5" fill="#b7b3aa" stroke="#8a867e" stroke-width="1"/>
    <rect x="70" y="138" width="10" height="24" rx="4" fill="#6b6862" stroke="#565350" stroke-width="0.8"/>
    <text x="75" y="124" font-family="system-ui, sans-serif" font-size="6.5" fill="#403e3b" text-anchor="middle">Jamrat al-Wusta</text>
  </g>

  <!-- ================= Exits ================= -->
  <!-- Exit W1, north-west corner: ground cells C-000-039 to C-007-039. -->
  <g>
    <rect x="0" y="0" width="40" height="10" fill="#bdb9b0" stroke="#8a867e" stroke-width="1"/>
    <path d="M4 10 L4 3 M12 10 L12 3 M20 10 L20 3 M28 10 L28 3 M36 10 L36 3" stroke="#8f8b83" stroke-width="0.7"/>
    <text x="20" y="7.4" font-family="system-ui, sans-serif" font-size="5.5" fill="#3f3d3a" text-anchor="middle">Exit W1</text>
  </g>

  <!-- Exit E2, south-east corner: ground cells C-054-000 to C-059-000. -->
  <g>
    <rect x="270" y="190" width="30" height="10" fill="#bdb9b0" stroke="#8a867e" stroke-width="1"/>
    <path d="M275 190 L275 197 M282 190 L282 197 M289 190 L289 197 M296 190 L296 197" stroke="#8f8b83" stroke-width="0.7"/>
    <text x="285" y="197.6" font-family="system-ui, sans-serif" font-size="5.5" fill="#3f3d3a" text-anchor="middle">Exit E2</text>
  </g>

  <!-- Approach stairs from the camps, east and south edges -->
  <g fill="#b3afa6" stroke="#8a867e" stroke-width="0.8">
    <rect x="290" y="60" width="10" height="26" rx="2"/>
    <rect x="290" y="120" width="10" height="26" rx="2"/>
    <rect x="120" y="190" width="26" height="10" rx="2"/>
    <rect x="190" y="190" width="26" height="10" rx="2"/>
  </g>
  <g stroke="#8f8b83" stroke-width="0.5">
    <path d="M291 64 H299 M291 68 H299 M291 72 H299 M291 76 H299 M291 80 H299"/>
    <path d="M291 124 H299 M291 128 H299 M291 132 H299 M291 136 H299 M291 140 H299"/>
    <path d="M124 191 V199 M130 191 V199 M136 191 V199 M142 191 V199"/>
    <path d="M194 191 V199 M200 191 V199 M206 191 V199 M212 191 V199"/>
  </g>

  <!-- Dominant movement: in from the east and south camps, past the two
       basins, out through the north-west and south-east exits. -->
  <g stroke="#96928b" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M270 74 L214 78 M222 73 L214 78 L221 83"/>
    <path d="M118 96 L70 122 M78 116 L70 122 L79 125"/>
    <path d="M52 138 L26 22 M25 32 L26 22 L33 30"/>
    <path d="M180 108 L252 178 M244 170 L252 178 L242 179"/>
  </g>

  <!-- Scale bar, the 50 m reference the setup step names -->
  <g>
    <rect x="14" y="178" width="50" height="2" fill="#3f3d3a"/>
    <rect x="14" y="175" width="1.2" height="8" fill="#3f3d3a"/>
    <rect x="38.4" y="176" width="1.2" height="6" fill="#3f3d3a"/>
    <rect x="62.8" y="175" width="1.2" height="8" fill="#3f3d3a"/>
    <text x="14" y="174" font-family="system-ui, sans-serif" font-size="5" fill="#3f3d3a">0</text>
    <text x="59" y="174" font-family="system-ui, sans-serif" font-size="5" fill="#3f3d3a">50 m</text>
  </g>

  <!-- North arrow. Image top is north, matching the grid: row 39 is north. -->
  <g transform="translate(283 30)">
    <path d="M0 -10 L4.5 6 L0 2.6 L-4.5 6 Z" fill="#3f3d3a"/>
    <text x="0" y="13" font-family="system-ui, sans-serif" font-size="6" fill="#3f3d3a" text-anchor="middle">N</text>
  </g>

  <text x="150" y="24" font-family="system-ui, sans-serif" font-size="7.5" fill="#3f3d3a" text-anchor="middle">Jamarat Bridge - central deck section</text>
</svg>
