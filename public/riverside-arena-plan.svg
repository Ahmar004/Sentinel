<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Riverside Arena site plan">
  <title>Riverside Arena site plan - 300 m by 200 m</title>
  <defs>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#9aa3ad" opacity="0.12" />
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6b7280" stroke-width="2" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Ground -->
  <rect x="0" y="0" width="1500" height="1000" fill="#e7e9ec" />

  <!-- Outer concourse ring -->
  <rect x="60" y="60" width="1380" height="880" rx="28" fill="#d7dbe0" stroke="#9aa3ad" stroke-width="4" />

  <!-- Arena bowl -->
  <ellipse cx="750" cy="500" rx="430" ry="300" fill="#c3c9d1" stroke="#6b7280" stroke-width="4" />
  <ellipse cx="750" cy="500" rx="300" ry="190" fill="url(#hatch)" stroke="#6b7280" stroke-width="3" />
  <ellipse cx="750" cy="500" rx="300" ry="190" fill="none" stroke="#6b7280" stroke-width="3" />
  <text x="750" y="500" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif"
        font-size="30" fill="#4b5563" letter-spacing="2">ARENA FLOOR</text>

  <!-- North gate approach: a breezeway cutting from the north concourse to the bowl -->
  <path d="M 660 60 L 840 60 L 800 250 L 700 250 Z" fill="#b9c6d6" stroke="#6b7280" stroke-width="3" />
  <text x="750" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#3b4a5c">
    NORTH GATE
  </text>

  <!-- South stand: the scale reference, "a known 50 m distance across the south stand" -->
  <rect x="360" y="800" width="780" height="120" fill="#c9cdd3" stroke="#6b7280" stroke-width="3" />
  <text x="750" y="865" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#3b4a5c">
    SOUTH STAND
  </text>

  <!-- Exit E1, South Gate -->
  <rect x="170" y="878" width="90" height="26" fill="#5b7a99" />
  <text x="215" y="936" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#2b3947">
    E1
  </text>
  <text x="215" y="962" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#4b5563">
    South Gate
  </text>

  <!-- Exit E2, North Gate -->
  <rect x="1330" y="96" width="26" height="90" fill="#5b7a99" />
  <text x="1400" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#2b3947">
    E2
  </text>
  <text x="1400" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#4b5563">
    North Gate
  </text>

  <!-- Scale reference: 50 m across the south stand -->
  <line x1="360" y1="946" x2="620" y2="946" stroke="#3b4a5c" stroke-width="3" />
  <line x1="360" y1="936" x2="360" y2="956" stroke="#3b4a5c" stroke-width="3" />
  <line x1="620" y1="936" x2="620" y2="956" stroke="#3b4a5c" stroke-width="3" />
  <text x="490" y="978" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#3b4a5c">
    50 m
  </text>

  <!-- Frame border -->
  <rect x="4" y="4" width="1492" height="992" fill="none" stroke="#9aa3ad" stroke-width="2" />
</svg>
